<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shikayat Saathi by Team TechSarthi – PRAYAS 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#eef4f1;
  --surface:#ffffff;
  --surface-alt:#f7faf9;
  --ink:#12231f;
  --muted:#4a615b;
  --pine:#0e2a36;
  --teal:#16798c;
  --teal-dark:#0f5c6b;
  --teal-soft:rgba(22,121,140,.1);
  --gold:#e8a317;
  --gold-soft:rgba(232,163,23,.16);
  --line:#d2e0db;
  --ok:#247a48;
  --danger:#d64545;
  --shadow:0 12px 32px rgba(14,42,54,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1715;--surface:#132428;--surface-alt:#192f34;--ink:#eaf3f0;--muted:#9cb5ae;
    --pine:#071318;--line:#253f44;--teal:#4cc3d9;--teal-dark:#2da4ba;--teal-soft:rgba(76,195,217,.14);
    --ok:#5cd68d;--shadow:0 12px 32px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1715;--surface:#132428;--surface-alt:#192f34;--ink:#eaf3f0;--muted:#9cb5ae;
  --pine:#071318;--line:#253f44;--teal:#4cc3d9;--teal-dark:#2da4ba;--teal-soft:rgba(76,195,217,.14);
  --ok:#5cd68d;--shadow:0 12px 32px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:64px;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;
  font-size:17.5px;line-height:1.55;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);
  background-size:24px 24px;
}
.wrap{max-width:860px;margin:0 auto}

/* ================= STICKY TOP NAVBAR (MATCHING SCREENSHOT) ================= */
.top-navbar{
  position:sticky;top:0;z-index:45;
  background:rgba(10,31,42,.95);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,.14);
  padding:8px 16px;color:#f4f9f7;
}
.nav-inner{
  max-width:960px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.nav-links{
  display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;
}
.nav-links::-webkit-scrollbar{display:none}
.nav-links button{
  background:transparent;border:0;color:#dcebe7;
  padding:6px 11px;border-radius:8px;font-size:14.5px;font-weight:700;
  white-space:nowrap;transition:all .15s;
}
.nav-links button:hover{background:rgba(255,255,255,.12);color:#fff}
.nav-links button.active{background:var(--gold);color:#12231f}

/* Hero & Real Uttarakhand Mountain Photo Backdrop */
header{
  position:relative;overflow:hidden;color:#f4f9f7;
  padding:24px 20px 155px;
  background:linear-gradient(175deg,#081d2b 0%,#154c61 52%,#d98a4e 100%);
}
.hero-bg-img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:.34;mix-blend-mode:luminosity;pointer-events:none;z-index:0;
}
.hero{position:relative;z-index:2}
.hero-grid{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.hero-photo-card{
  width:154px;height:154px;border-radius:22px;overflow:hidden;
  border:3px solid rgba(255,227,163,.55);box-shadow:0 14px 32px rgba(0,0,0,.38);
  position:relative;flex-shrink:0;background:#0e2a36;
}
.hero-photo-card img{width:100%;height:100%;object-fit:cover;display:block}
.hero-photo-cap{
  position:absolute;bottom:0;left:0;right:0;padding:4px 8px;
  background:linear-gradient(transparent,rgba(8,29,43,.9));
  color:#ffe3a3;font-size:11.5px;font-weight:700;text-align:center;
}
.brand-box{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:.01em;color:#fff}
.brand-icon{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--gold),#f3b83a);color:#12231f;
  font-size:18px;box-shadow:0 4px 12px rgba(0,0,0,.25);
}
.controls{display:flex;align-items:center;gap:8px}
.theme-btn{
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);
  color:#fff;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  font-size:15px;transition:background .2s;
}
.theme-btn:hover{background:rgba(255,255,255,.22)}
.lang{display:inline-flex;background:rgba(0,0,0,.25);padding:3px;border-radius:10px;border:1px solid rgba(255,255,255,.22)}
.lang button{
  background:transparent;border:0;color:#e6f0ed;padding:3px 12px;
  font:inherit;font-size:13.5px;font-weight:700;border-radius:7px;transition:all .2s;
}
.lang button[aria-pressed="true"]{background:var(--gold);color:#12231f}
.eyebrow{
  display:inline-flex;align-items:center;gap:6px;margin-top:8px;
  font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:#ffe3a3;background:rgba(0,0,0,.3);padding:4px 12px;border-radius:99px;
  border:1px solid rgba(255,227,163,.35);
}
h1{font-size:clamp(28px,5.5vw,48px);line-height:1.12;font-weight:800;margin:12px 0 12px;letter-spacing:-.015em;text-shadow:0 3px 20px rgba(0,0,0,.4)}
header p{margin:0;max-width:52ch;color:#e7f2ef;font-size:16.5px;text-shadow:0 1px 8px rgba(0,0,0,.3)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);
  color:#fff;border-radius:99px;padding:5px 14px;font-size:14px;font-weight:600;
  backdrop-filter:blur(6px);
}
.peaks{position:absolute;left:0;bottom:-1px;width:100%;height:150px;z-index:1;pointer-events:none}
.peaks .f{fill:var(--bg)}

/* Main Layout & Cards */
main{margin-top:-72px;padding:0 16px 88px;position:relative;z-index:3}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:24px;margin-bottom:18px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;animation:fadeSlide .35s ease;
}
.card.accent-top::before{
  content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--teal),var(--gold));
}
@keyframes fadeSlide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
h2{font-size:22px;font-weight:800;margin:0 0 10px;letter-spacing:-.01em}
label{font-weight:700;display:block;margin-bottom:8px}

/* Real Photo Section Banners */
.sec-banner{
  display:flex;align-items:center;gap:16px;padding:12px 14px;margin-bottom:18px;
  border-radius:16px;background:linear-gradient(135deg,var(--teal-soft),var(--gold-soft));
  border:1px solid var(--line);
}
.sec-banner img{
  width:74px;height:74px;border-radius:14px;object-fit:cover;flex-shrink:0;
  border:2px solid var(--surface);box-shadow:0 4px 12px rgba(0,0,0,.12);
}
.sec-banner h2{margin:0 0 2px;font-size:20px}
.sec-banner p{margin:0;font-size:14.5px;color:var(--muted)}

/* Visual Category Selector Strip */
.cat-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 16px}
.cat-pill{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:8px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--surface-alt);color:var(--ink);font-size:13.5px;font-weight:700;
  text-align:center;transition:all .15s;overflow:hidden;
}
.cat-pill:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:var(--shadow)}
.cat-pill.active{border-color:var(--teal);background:var(--teal-soft);box-shadow:inset 0 0 0 1px var(--teal)}
.cat-pill img{width:100%;height:56px;object-fit:cover;border-radius:9px;display:block}

/* Inputs & Buttons */
textarea,input[type="text"],input[type="tel"],input[type="number"],select{
  width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);
  border-radius:12px;background:var(--surface-alt);color:var(--ink);
  transition:border-color .2s,box-shadow .2s,background .2s;
}
textarea{min-height:118px;resize:vertical}
textarea:focus,input:focus,select:focus{
  outline:none;border-color:var(--teal);background:var(--surface);
  box-shadow:0 0 0 4px var(--teal-soft);
}
button{font:inherit;cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(135deg,var(--teal),#239689);color:#fff;
  border:0;border-radius:12px;padding:11px 20px;font-weight:700;
  box-shadow:0 6px 16px rgba(22,121,140,.28);transition:transform .15s,box-shadow .15s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(22,121,140,.36)}
.btn.alt{
  background:var(--surface-alt);color:var(--ink);border:1.5px solid var(--line);box-shadow:none;
}
.btn.alt:hover{border-color:var(--teal);background:var(--teal-soft)}
.btn.listening{background:linear-gradient(135deg,#d64545,#e66a45);color:#fff;border-color:transparent;animation:pulseRed 1.4s infinite}
@keyframes pulseRed{50%{box-shadow:0 0 0 8px rgba(214,69,69,.22)}}
a.btn{text-decoration:none}

.chip{
  background:var(--surface-alt);border:1px solid var(--line);color:var(--muted);
  border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;transition:all .15s;
}
.chip:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-soft)}
.hint{color:var(--muted);font-size:14.5px;margin:10px 0 0}

/* Secondary Navigation Tabs */
nav.tabs{
  display:flex;gap:6px;overflow-x:auto;margin:0 0 18px;padding:6px;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);scrollbar-width:none;
}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  white-space:nowrap;background:transparent;color:var(--muted);border:0;
  border-radius:11px;padding:8px 14px;font-weight:700;font-size:14.5px;transition:all .2s;
}
nav.tabs button:hover{color:var(--ink);background:var(--surface-alt)}
nav.tabs button[aria-current="true"]{
  background:linear-gradient(135deg,var(--gold),#f0b32c);color:#12231f;
  box-shadow:0 3px 10px rgba(232,163,23,.32);
}

/* Form Grid & Badges */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fields div.full{grid-column:1/-1}
.fields small{display:block;color:var(--muted);font-size:13.5px;margin-bottom:5px;font-weight:700}
.badge{
  display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;
  font-size:14px;font-weight:700;background:var(--gold-soft);color:var(--ink);
  border:1px solid rgba(232,163,23,.45);
}
.tag{
  display:inline-block;padding:2px 9px;border-radius:6px;font-size:12.5px;
  font-weight:700;background:var(--teal-soft);color:var(--teal);margin-bottom:6px;
}
.hidden{display:none!important}

/* Photo Attachment Box */
.photo-box{
  margin-top:12px;padding:12px;border:1.5px dashed var(--line);border-radius:12px;
  background:var(--surface-alt);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.photo-prev{max-height:76px;border-radius:8px;border:1px solid var(--line)}

/* Timeline Tracker */
ol.track{list-style:none;margin:18px 0 0;padding:0 0 0 8px;border-left:3px solid var(--line)}
ol.track li{position:relative;padding:0 0 20px 24px}
ol.track li:last-child{padding-bottom:4px}
ol.track li::before{
  content:"";position:absolute;left:-11px;top:4px;width:19px;height:19px;
  border-radius:50%;background:var(--surface);border:3px solid var(--line);
}
ol.track li.done::before{background:var(--ok);border-color:var(--ok);box-shadow:0 0 0 4px rgba(36,122,72,.15)}
ol.track li.now::before{background:var(--gold);border-color:var(--gold);animation:p 1.6s ease-in-out infinite}
ol.track b{display:block;font-size:16.5px}
ol.track span{color:var(--muted);font-size:14.5px}
@keyframes p{50%{box-shadow:0 0 0 8px rgba(232,163,23,.28)}}

/* Services Grid */
.svc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc button{
  display:flex;align-items:center;gap:12px;text-align:left;
  background:var(--surface-alt);border:1.5px solid var(--line);border-radius:14px;
  padding:13px 14px;color:var(--ink);font-weight:700;transition:all .15s;
}
.svc button:hover{transform:translateY(-2px);border-color:var(--teal);background:var(--surface);box-shadow:var(--shadow)}
.svc button[aria-pressed="true"]{
  border-color:var(--teal);background:var(--teal-soft);box-shadow:inset 0 0 0 1px var(--teal);
}
.svc-ico{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--line);font-size:20px;flex-shrink:0;
}
.guide-box{
  margin-top:18px;padding:18px;border-radius:14px;
  background:var(--surface-alt);border:1px solid var(--line);
}
ol.how{padding-left:20px;margin:10px 0}
ol.how li{margin-bottom:6px}

/* Scheme Result Cards */
.sch-card{
  margin:14px 0 0;padding:16px;border-radius:16px;
  background:var(--surface-alt);border:1px solid var(--line);
  display:flex;gap:16px;align-items:flex-start;transition:transform .15s,border-color .15s;
}
.sch-card:hover{border-color:var(--teal);transform:translateY(-2px)}
.sch-thumb{width:96px;height:96px;border-radius:12px;object-fit:cover;flex-shrink:0;border:1px solid var(--line)}

/* ================= PORTAL DASHBOARD KPI & BARS ================= */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.stat-box{
  background:var(--surface-alt);border:1.5px solid var(--line);border-radius:18px;
  padding:20px 16px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.03);
}
.stat-num{font-size:34px;font-weight:800;color:var(--teal);line-height:1.1;display:block}
.stat-lbl{font-size:14.5px;font-weight:700;color:var(--muted);margin-top:6px;display:block}
.dept-bar-row{margin-bottom:12px}
.dept-bar-top{display:flex;justify-content:space-between;font-size:14.5px;font-weight:700;margin-bottom:4px}
.dept-bar-bg{height:10px;background:var(--surface-alt);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.dept-bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));border-radius:99px}

/* ================= NEWS / WHAT'S NEW & FAQ ================= */
.news-item{
  padding:14px 16px;border-radius:14px;background:var(--surface-alt);
  border:1px solid var(--line);margin-bottom:12px;
}
.news-item h3{margin:4px 0;font-size:17.5px}
details.faq-item{
  background:var(--surface-alt);border:1px solid var(--line);
  border-radius:14px;padding:12px 16px;margin-bottom:10px;
}
details.faq-item summary{font-weight:700;cursor:pointer;font-size:16.5px}
details.faq-item p{margin:8px 0 0;color:var(--muted);font-size:15.5px}

/* User Greeting Bar */
.hello-bar{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:10px 16px;margin-bottom:14px;box-shadow:var(--shadow);font-weight:700;
}
.note{font-size:13.5px;color:var(--muted);text-align:center;max-width:62ch;margin:0 auto}

/* ================= FLOATING CHATBOT WIDGET ================= */
.chat-fab{
  position:fixed;right:20px;bottom:20px;z-index:50;
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,var(--pine),var(--teal));
  color:#fff;border:2px solid rgba(255,227,163,.45);
  border-radius:99px;padding:12px 18px;font-weight:800;font-size:15.5px;
  box-shadow:0 12px 28px rgba(8,29,43,.35);transition:transform .2s;
}
.chat-fab:hover{transform:translateY(-3px)}
.chat-win{
  position:fixed;right:20px;bottom:84px;z-index:55;
  width:360px;max-width:calc(100vw - 32px);height:480px;max-height:calc(100vh - 110px);
  background:var(--surface);border:1.5px solid var(--line);border-radius:22px;
  box-shadow:0 20px 48px rgba(8,29,43,.32);
  display:flex;flex-direction:column;overflow:hidden;animation:fadeSlide .25s ease;
}
.chat-head{
  background:linear-gradient(135deg,var(--pine),var(--teal));
  color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;
}
.chat-head b{font-size:16px;display:block;line-height:1.2}
.chat-head span{font-size:12px;color:#cde7e2}
.chat-close{
  background:rgba(255,255,255,.16);border:0;color:#fff;
  width:30px;height:30px;border-radius:8px;font-size:16px;font-weight:700;
}
.chat-body{
  flex:1;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;
  background:var(--surface-alt);
}
.msg{max-width:85%;padding:10px 13px;border-radius:15px;font-size:15px;line-height:1.45;word-wrap:break-word}
.msg.bot{align-self:flex-start;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.user{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:4px}
.msg-act{
  display:inline-block;margin-top:8px;padding:5px 11px;border-radius:8px;
  background:var(--gold);color:#12231f;border:0;font-size:13px;font-weight:800;
}
.chat-quick{
  display:flex;gap:6px;overflow-x:auto;padding:8px 12px;
  background:var(--surface);border-top:1px solid var(--line);scrollbar-width:none;
}
.chat-quick::-webkit-scrollbar{display:none}
.chat-quick button{
  white-space:nowrap;font-size:12.5px;padding:4px 10px;border-radius:99px;
  background:var(--teal-soft);color:var(--teal);border:1px solid transparent;font-weight:700;
}
.chat-quick button:hover{border-color:var(--teal)}
.chat-foot{display:flex;gap:8px;padding:10px;background:var(--surface);border-top:1px solid var(--line)}
.chat-foot input{padding:9px 12px;font-size:15px;border-radius:10px}
.chat-foot button{padding:9px 14px;border-radius:10px}

@media (max-width:640px){
  .hero-grid{grid-template-columns:1fr}
  .hero-photo-card{display:none}
  .fields,.svc,.stat-grid{grid-template-columns:1fr}
  .cat-strip{grid-template-columns:repeat(2,1fr)}
  .sch-card{flex-direction:column}
  .sch-thumb{width:100%;height:140px}
  header{padding-bottom:135px}
  .card{padding:18px}
  .chat-fab{right:14px;bottom:14px;padding:10px 15px}
  .chat-win{right:14px;bottom:72px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<!-- STICKY TOP NAVBAR (शिकायत | सेवाएँ | डैशबोर्ड | हमारे बारे में | नया क्या है | FAQ | संपर्क) -->
<div class="top-navbar">
  <div class="nav-inner">
    <div class="brand-box"><span class="brand-icon">🏔️</span><span id="brand"></span></div>
    <div class="nav-links" id="topNavLinks"></div>
    <div class="controls">
      <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode" title="Theme">🌓</button>
      <span class="lang" role="group" aria-label="Language">
        <button id="hi" aria-pressed="true">हिन्दी</button>
        <button id="en" aria-pressed="false">English</button>
      </span>
    </div>
  </div>
</div>

<header>
  <img class="hero-bg-img" src="https://images.unsplash.com/photo-1626621341517-bbf3d9990a23?auto=format&fit=crop&w=1400&q=80" alt="" aria-hidden="true" onerror="this.style.display='none'">

  <svg class="peaks" viewBox="0 0 1440 220" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 220V120L140 60 230 110 340 40 470 120 580 70 700 130 820 50 950 115 1070 65 1200 125 1320 80 1440 120V220Z" fill="#6fa3b5" opacity=".5"/>
    <path d="M310 62L340 40 370 64 350 58 340 66 328 57Z M792 72L820 50 850 74 832 67 820 76 806 66Z M1044 82L1070 65 1098 84 1082 78 1070 86 1058 77Z" fill="#fff" opacity=".88"/>
    <path d="M0 220V150L120 100 250 150 400 90 540 155 690 105 840 160 990 95 1130 155 1290 110 1440 150V220Z" fill="#235c66" opacity=".85"/>
    <path class="f" d="M0 220V175L90 150 180 178 300 140 420 180 560 150 700 185 860 145 1000 182 1150 150 1300 180 1440 160V220Z"/>
  </svg>

  <div class="wrap hero">

function classify(x){
  if(quickCat!==null)return quickCat;
  var q=x.toLowerCase(),best=C.length-1,n=0;
  C.forEach(function(c,i){var h=c.w.filter(function(w){return q.indexOf(w)>-1}).length;if(h>n){n=h;best=i}});
  return best;
}
function urgency(x){
  var q=x.toLowerCase();
  if(/(आग|दुर्घटना|accident|fire|emergency|ख़तरनाक|खतरनाक|dangerous)/.test(q))return 2;
  if(/(दिन|रात|days|night|since)/.test(q))return 1;
  return 0;
}
function place(x){
  var m1=x.match(/(?:in|at|near|मोहल्ले|गाँव|गांव|वार्ड)\s+([^\s,.]+(?:\s[^\s,.]+)?)/i);
  if(m1)return m1[1];
  var m2=x.match(/([^\s,.]+(?:\s[^\s,.]+)?)\s+(?:मोहल्ले|गाँव|गांव|वार्ड)/i);
  return m2?m2[1]:"";
}

  var c=C[cur.cat],d=$("distSel").value;

  $("dept").textContent=t().dept+c.d+" ("+d+")";
  $("catSel").value=cur.cat;$("urg").value=cur.urg;$("place").value=cur.place;$("summ").value=cur.text.slice(0,120);
}

}
